name: Load

# Нагрузочные проверки BookClub (k6). Запускаются вручную кнопкой Run workflow
# и при изменении самих сценариев. На каждый обычный коммит их не гоняем: они долгие и грузят раннер.
on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'tests/load/**'
      - '.github/workflows/load.yml'

permissions:
  contents: write   # нужно только чтобы выложить короткий итог в ветку ci-status-load

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookclub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=bookclub_test;Username=postgres;Password=postgres
      Jwt__Key: ci-only-signing-key-for-tests-0123456789-abcdefghijklmnop
      BOOKCLUB_URL: http://127.0.0.1:5153

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prepare log folder
        run: mkdir -p logs

      - name: Build the site
        id: build
        run: dotnet build BookClub.csproj -c Release 2>&1 | tee logs/build.log

      - name: Create database tables (EF migrations)
        id: migrate
        run: |
          {
            dotnet tool install --global dotnet-ef --version 10.0.12
            export PATH="$PATH:$HOME/.dotnet/tools"
            dotnet ef database update --no-build --configuration Release
          } 2>&1 | tee logs/migrate.log

      - name: Start the site
        id: site
        run: |
          nohup dotnet run --no-build --no-launch-profile -c Release --project BookClub.csproj --urls http://127.0.0.1:5153 > site.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5153/api/books > /dev/null 2>&1; then echo "Site is up after $i s"; exit 0; fi
            sleep 1
          done
          echo "Site did not start"; cat site.log; exit 1

      - name: Install k6
        id: k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'

      - name: Smoke check (one user, whole journey)
        id: smoke
        continue-on-error: true
        run: k6 run --no-color tests/load/smoke.js 2>&1 | tee logs/smoke.log

      - name: Load test
        id: load
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        run: k6 run --no-color --summary-export=load-summary.json tests/load/load.js 2>&1 | tee logs/load.log

      # Поиск предела: ступеньки с растущим числом новых людей в секунду. Это измерение, а не приёмка,
      # поэтому шаг не может покраснить запуск (continue-on-error и в конце его исход не проверяется).
      - name: Stress test (finding the limit, informational)
        id: stress
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        run: k6 run --no-color tests/load/stress.js 2>&1 | tee logs/stress.log

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-results
          path: |
            load-summary.json
            logs
            site.log
          if-no-files-found: ignore

      - name: Publish a short summary to branch ci-status-load
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/status"
          {
            echo "run=${GITHUB_RUN_NUMBER}"
            echo "sha=${GITHUB_SHA}"
            echo "result=${RESULT}"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "cpus=$(nproc) memory_mb=$(free -m | awk '/Mem:/ {print $2}')"
            echo "--- steps ---"
            python3 -c 'import json,os; d=json.loads(os.environ["STEPS_JSON"]); [print(k+": "+str(v.get("outcome"))) for k,v in d.items()]'
            for n in build migrate; do
              if [ -f "logs/$n.log" ]; then echo "--- $n (tail) ---"; tail -n 15 "logs/$n.log"; fi
            done
            if [ -f logs/smoke.log ]; then echo "--- smoke (tail) ---"; tail -n 45 logs/smoke.log; fi
            if [ -f logs/load.log ]; then echo "--- load (tail) ---"; tail -n 110 logs/load.log; fi
            if [ -f logs/stress.log ]; then
              echo "--- stress (per step) ---"
              grep -E "rate_[0-9]+|dropped_iterations|iterations\.+:|http_req_failed|vus_max" logs/stress.log
              echo "--- stress (tail) ---"; tail -n 25 logs/stress.log
            fi
            if [ -f site.log ]; then echo "--- site.log (tail) ---"; tail -n 30 site.log; fi
          } > "$RUNNER_TEMP/status/status-load.txt"
          cd "$RUNNER_TEMP/status"
          git init -q
          git checkout -q -b ci-status-load
          git add status-load.txt
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Нагрузка ${GITHUB_RUN_NUMBER}: ${RESULT}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-status-load

      - name: Fail the run if smoke or load failed
        if: steps.smoke.outcome == 'failure' || steps.load.outcome == 'failure'
        run: exit 1
